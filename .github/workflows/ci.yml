name: CI

on:
  pull_request:
    branches: ['unstable']

jobs:
  nixos-distro:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        install_options: --no-daemon
    - name: Test desktop build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."desktop".config.system.build.toplevel'
    - name: Test laptop build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."laptop".config.system.build.toplevel'
    - name: Test ARM build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."arm".config.system.build.toplevel'
    - name: Test darwin eval
      working-directory: ./tests
      # Eval-only: a Linux runner can't build a darwin closure, but cross-system module
      # evaluation catches the whole module tree failing to evaluate (undeclared options,
      # broken imports, etc).
      run: nix eval '.#darwinConfigurations."mac".config.system.build.toplevel'
