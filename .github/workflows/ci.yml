name: CI

on:
  pull_request:
    branches: ['unstable']

jobs:
  nixos-distro:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      with:
        install_options: --no-daemon
    - name: Test desktop build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."desktop".config.system.build.toplevel'
    - name: Test laptop build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."laptop".config.system.build.toplevel'
    - name: Test ARM build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."arm".config.system.build.toplevel'
