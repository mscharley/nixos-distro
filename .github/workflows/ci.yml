name: CI

on:
  pull_request:
    branches: ['unstable']

jobs:
  nixos-distro:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      with:
        install_options: --no-daemon
    - name: Test desktop build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."desktop".config.system.build.toplevel'
    - name: Test laptop build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."laptop".config.system.build.toplevel'
    - name: Test ARM build
      working-directory: ./tests
      run: nix eval '.#nixosConfigurations."arm".config.system.build.toplevel'
